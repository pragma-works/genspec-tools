name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # the python control project of gs-check needs python and pytest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      # the tests build throwaway git repositories and commit in them
      - run: git config --global user.name "ci" && git config --global user.email "ci@example.com"
      - run: git config --global init.defaultBranch main
      - run: node scripts/run-tests.mjs
      # the repository checks itself with its own gs-check in strict mode (Linux and one Node version only: it takes minutes, and about ten on Windows)
      # E09 is judged since the commit before the adoption of the L1 setup; see README, "This repository's own status"
      - name: gs-check strict on this repository
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/self-check.mjs --since a101644
